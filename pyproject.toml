[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-provider-gateway"
dynamic = ["version"]
description = "OpenAI-compatible gateway for independently maintained AI providers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.19.0",
    "fastapi>=0.100.0",
    "perplexity-api",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
driver = ["patchright>=1.0.0"]

[project.scripts]
ai-provider-gateway = "ai_provider_gateway.api.app:main"
perplexity-login = "ai_provider_gateway.integrations.perplexity.session:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ai_provider_gateway.version.__version__"}

[tool.uv.sources]
perplexity-api = { path = "vendor/perplexity-ai", editable = true }
